<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Progress Maker</title>
<style>
body { background: #eef2f6; color: #172738; font: 1rem system-ui, sans-serif; margin: 0; }
main { background: white; max-width: 42rem; margin: 5vh auto; padding: clamp(1rem, 5vw, 3rem); border-radius: 1rem; }
h1 { margin-top: 0; }
form { display: grid; gap: 1rem; }
label { display: grid; gap: .35rem; font-weight: 600; }
input, select, button { font: inherit; padding: .65rem; min-width: 0; border: 1px solid #8799aa; border-radius: .4rem; }
button { background: #164e75; color: white; cursor: pointer; }
button:disabled { opacity: .65; }
[hidden] { display: none !important; }
.template-download { display: inline-block; padding: .65rem; border: 1px solid #164e75; border-radius: .4rem; color: #164e75; font-weight: 600; }
#status { min-height: 1.5em; }
</style>
</head>
<body>
<main>
<h1>Student Progress Maker</h1>
<p>Upload an Excel class record and choose how to download your student progress sheets.</p>
<p>Use this class record format to generate progress sheets.</p>
<p><a class="template-download" href="/class-record-template" download>Download class record template (.xlsm)</a></p>
<form action="/generate" method="post" enctype="multipart/form-data">
<label>Class record (.xlsx or .xlsm)<input name="workbook" type="file" accept=".xlsx,.xlsm" required></label>
<label id="worksheet-field" hidden>Worksheet<select name="worksheet" disabled></select></label>
<label>Program / Year / Section<input name="section" placeholder="Example: BS Pharmacy 1A" maxlength="60" required></label>
<label>Course code<input name="course_code" maxlength="30" required></label>
<label>Academic year<input name="academic_year" placeholder="2026–2027" maxlength="20" required></label>
<label>Course description<input name="course_description" maxlength="100" required></label>
<label>Course type<select name="course_type" required>
<option value="">Choose a course type</option><option value="lecture">Lecture</option><option value="laboratory">Laboratory</option><option value="rle">RLE</option>
</select></label>
<label>Term<select name="term" required>
<option value="">Choose a term</option><option value="first">First</option><option value="second">Second</option><option value="summer">Summer</option>
</select></label>
<label>Output format<select name="output_format">
<option value="combined">One Word file for all students</option>
<option value="individual">One Word file per student (ZIP)</option>
</select></label>
<button type="submit">Download progress sheets</button>
</form>
<p id="status" role="status"></p>
</main>
<script>
const form = document.querySelector("form");
const button = form.querySelector("button");
const status = document.querySelector("#status");
const workbook = form.elements.workbook;
const worksheet = form.elements.worksheet;
const worksheetField = document.querySelector("#worksheet-field");
let inspection;

workbook.addEventListener("change", async () => {
  inspection?.abort();
  inspection = new AbortController();
  const {signal} = inspection;
  worksheet.replaceChildren();
  worksheet.disabled = true;
  worksheet.required = false;
  worksheetField.hidden = true;
  button.disabled = true;
  status.textContent = "";
  if (!workbook.files.length) return;

  status.textContent = "Checking workbook sheets…";
  try {
    const data = new FormData();
    data.append("workbook", workbook.files[0]);
    const response = await fetch("/worksheets", {method: "POST", body: data, signal});
    const sheets = await response.json();
    if (signal.aborted) return;
    if (!response.ok) throw new Error(sheets.detail || "Could not read the workbook.");
    if (!sheets.some((sheet) => sheet.compatible)) {
      throw new Error("No worksheet matches the class record format.");
    }
    if (sheets.length > 1) {
      worksheet.add(new Option("Choose a worksheet", ""));
      for (const sheet of sheets) {
        const option = new Option(sheet.compatible ? sheet.name : sheet.name + " (wrong format)", sheet.name);
        option.disabled = !sheet.compatible;
        worksheet.add(option);
      }
      worksheetField.hidden = false;
      worksheet.disabled = false;
      worksheet.required = true;
    }
    status.textContent = "";
    button.disabled = false;
  } catch (error) {
    if (!signal.aborted) status.textContent = error.message;
  }
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const data = new FormData(form);
  workbook.disabled = true;
  button.disabled = true;
  status.textContent = "Generating progress sheets…";
  try {
    const response = await fetch(form.action, {method: "POST", body: data});
    if (!response.ok) {
      const problem = await response.json().catch(() => ({}));
      throw new Error(typeof problem.detail === "string" ? problem.detail : "Check the form and try again.");
    }
    const url = URL.createObjectURL(await response.blob());
    const link = document.createElement("a");
    link.href = url;
    link.download = response.headers.get("Content-Type") === "application/zip"
      ? "student-progress-sheets.zip"
      : "student-progress-sheets.docx";
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    status.textContent = "Your download is ready.";
  } catch (error) {
    status.textContent = error.message;
  } finally {
    workbook.disabled = false;
    button.disabled = false;
  }
});
</script>
</body>
</html>
